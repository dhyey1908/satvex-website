<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satvex — Designed for Her. Made to Move.</title>
    <meta
      name="description"
      content="SATVEX creates modern women-focused essentials designed around flexibility, comfort, durability and effortless style."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Satvex" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Satvex — Designed for Her. Made to Move." />
    <meta
      property="og:description"
      content="Modern women-focused essentials designed around flexibility, comfort, durability and effortless style."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/assets/placeholders/logo.svg" />
    <meta name="theme-color" content="#6b4fa0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Copy of the tokens in src/styles/theme.css (this document loads before the app). */
      :root {
        --color-bg: #faf7fd;
        --color-surface-alt: #efe6f8;
        --color-border: #e0d2ee;
        --color-primary: #6b4fa0;
        --color-primary-hover: #583e8a;
        --color-primary-contrast: #ffffff;
        --color-text: #2e2338;
        --color-text-muted: #66596f;
      }
      body { margin: 0; background: var(--color-bg); color: var(--color-text); }
      .app-skeleton { max-width: 1280px; margin: 0 auto; padding: 0 20px 40px; }
      .sk-bar { display: flex; align-items: center; justify-content: space-between; height: 68px; }
      .sk-block { display: block; background: linear-gradient(90deg, var(--color-surface-alt) 25%, var(--color-border) 50%, var(--color-surface-alt) 75%); background-size: 200% 100%; border-radius: 8px; animation: sk-shimmer 1.4s ease-in-out infinite; }
      .sk-logo { width: 96px; height: 28px; }
      .sk-nav { width: 160px; height: 20px; }
      .sk-hero { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 16px; }
      .sk-image { width: 100%; aspect-ratio: 1 / 1; max-height: 560px; }
      .sk-text { display: flex; flex-direction: column; gap: 14px; }
      .sk-line { height: 16px; width: 100%; }
      .sk-title { height: 32px; width: 70%; }
      .sk-short { width: 45%; }
      .sk-btn { height: 48px; width: 100%; margin-top: 10px; }
      .sk-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (min-width: 860px) { .sk-hero { grid-template-columns: 1.3fr 1fr; } .sk-btn { width: 220px; } }
      @media (prefers-reduced-motion: reduce) { .sk-block { animation: none; } }
      @keyframes sk-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    </style>
  </head>
  <body>
    <div id="root"><!--app-skeleton--><div class="app-skeleton" role="status" aria-busy="true" aria-live="polite">
      <div class="sk-bar"><span class="sk-block sk-logo"></span><span class="sk-block sk-nav"></span></div>
      <div class="sk-hero"><span class="sk-block sk-image"></span>
        <div class="sk-text"><span class="sk-block sk-line sk-title"></span><span class="sk-block sk-line"></span><span class="sk-block sk-line sk-short"></span><span class="sk-block sk-btn"></span></div>
      </div>
      <span class="sk-sr">Loading page</span>
    </div><!--/app-skeleton--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
