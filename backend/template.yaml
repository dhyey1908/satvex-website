AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SATVEX — minimum-cost serverless ecommerce infrastructure.
  API Gateway (HTTP API) -> Lambda (Express) -> DynamoDB, plus S3 + CloudFront
  for the static frontend and product media.

Parameters:
  Stage:
    Type: String
    # prod is the only environment (the original dev stack was deleted 2026-10-14).
    # Stage still suffixes every resource name, so a throw-away sandbox can be
    # re-created by widening AllowedValues and adding a samconfig [dev] block.
    Default: prod
    AllowedValues: [prod]
  FrontendOrigin:
    Type: String
    Description: >
      Comma-separated list of exact origins the API/media bucket should allow
      via CORS (e.g. http://localhost:5173,https://satvex.com)
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Long random secret used to sign auth JWTs
  SesSenderEmail:
    Type: String
    Description: Verified SES sender address for password-reset emails
  ResetTokenExpiresMin:
    Type: Number
    Default: 30
  RefreshTokenMaxAgeDays:
    Type: Number
    Default: 730
    Description: Absolute cap (from first login) on how long a device can stay signed in via silent refresh before a fresh OTP is required
  PayuMerchantKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: PayU merchant key — test key for dev, live key after cutover
  PayuMerchantSalt:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      PayU merchant salt — used both for the payment-request hash and to
      verify the surl/furl response hash (PayU has no separate
      webhook-signing secret).
  PayuEnv:
    Type: String
    Default: test
    AllowedValues: [test, production]
  ShiprocketEmail:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      Shiprocket API user email (Settings > API > Add New API User — must
      differ from the main panel login email). Leave blank until ready —
      gated separately by settings.shiprocket.enabled, which defaults to
      false so no real API calls happen until explicitly turned on.
  ShiprocketPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: Shiprocket API user password.
  ShiprocketWebhookToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      Our own chosen token, set as the "security token" in Shiprocket's
      Settings > API > Webhooks panel. Compared against the x-api-key header
      on every webhook call. Optional — leave blank to skip the check
      entirely (not recommended once this is live).
  ShiprocketBaseUrl:
    Type: String
    Default: 'https://apiv2.shiprocket.in'
    Description: >
      Override to point at Shiprocket's sandbox environment for testing
      instead of production — no code change needed.
  ShiprocketServiceabilityBaseUrl:
    Type: String
    Default: 'https://serviceability.shiprocket.in'
  SnsSenderId:
    Type: String
    Default: ''
    Description: >
      DLT-approved alphanumeric Sender ID for SMS to Indian numbers (e.g.
      Settings > SMS preferences in the SNS console, or whatever your DLT
      platform issued). SMS to Indian numbers will not deliver without a
      registered DLT Principal Entity ID + approved template on the AWS
      account, regardless of this value — see otpService.js for details.
  MiniMothApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      MiniMoth OTP API key (mm_live_... for production, mm_test_... for the
      sandbox, which sends nothing and always accepts code 000000). When set,
      login/verification codes are sent over WhatsApp with SMS fallback by
      MiniMoth instead of AWS SNS SMS. Leave blank to keep using SNS.
  OtpProvider:
    Type: String
    Default: ''
    AllowedValues: ['', 'minimoth', 'sns']
    Description: >
      Force the OTP channel. Blank = MiniMoth when MiniMothApiKey is set, else
      SNS. Set to 'sns' to roll back to SNS without removing the key.
  OtpTestPhones:
    Type: String
    Default: ''
    Description: >
      Comma-separated 10-digit numbers that always accept OTP code 123456
      with no real SMS/WhatsApp sent — a deliberately narrow, deployable
      bypass for testing the live site before real WhatsApp/SMS delivery is
      wired up. Every number NOT in this list goes through the real OTP
      path exactly as normal, in production too. Leave blank to disable
      entirely once real delivery is live — see otpService.js isTestMode.

  FrontendDomainNames:
    Type: CommaDelimitedList
    Default: satvex.co.in,www.satvex.co.in
    Description: >
      Custom domain names (CloudFront aliases) the storefront is served on.
      They were attached to the distribution in the console, so they must be
      restated here or the next stack update would detach them and take the
      site offline. Leave blank only to serve from the CloudFront domain.
  FrontendCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:311376802787:certificate/c90702cf-a7be-4100-9ed6-ef61612ff925
    Description: ACM certificate (must be in us-east-1) covering FrontendDomainNames.

  FrontendWebAclArn:
    Type: String
    Default: arn:aws:wafv2:us-east-1:311376802787:global/webacl/CreatedByCloudFront-b0510358/38aa863e-6b97-42ee-ab21-cb381c0886b8
    Description: >
      The web ACL attached to the storefront distribution. It was attached by
      CloudFront when the distribution joined a flat-rate pricing plan, and
      such a distribution cannot be updated without it ("You can't remove or
      replace the web ACL") - so it must be restated here or every stack update
      that touches the distribution fails and rolls back. Leave blank only if
      the distribution is not on a pricing plan.

Conditions:
  HasFrontendDomain: !Not [!Equals [!Join ['', !Ref FrontendDomainNames], '']]
  HasFrontendWebAcl: !Not [!Equals [!Ref FrontendWebAclArn, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 10

Resources:
  ## ---------- DynamoDB ----------

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_users_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: verifiedPhone
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # Sparse index: only users with a verified phone appear here, which
        # is exactly what phone-based login/lookup needs — an unverified
        # phone number must never be usable to look up/log into an account
        # (see authController.register/login).
        - IndexName: verifiedPhone-index
          KeySchema:
            - AttributeName: verifiedPhone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  OtpCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_otp_codes_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: phone
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Opaque, hashed refresh tokens backing the long-lived (up to
  # RefreshTokenMaxAgeDays) side of auth — see authController.refresh /
  # refreshTokenService.js. Only the SHA-256 hash is ever stored (same
  # pattern as the password-reset token on UsersTable), keyed directly by
  # that hash for an O(1) lookup on refresh. The userId-index exists so a
  # detected stolen/replayed token can revoke every session for that user
  # at once, not just the one token.
  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_refresh_tokens_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_products_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_orders_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: paymentStatus
          AttributeType: S
        - AttributeName: paymentExpiresAt
          AttributeType: S
        - AttributeName: shiprocketOrderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Lets Shiprocket's tracking webhook (which identifies the order by
        # Shiprocket's own order id, sr_order_id) look the order up by
        # Query instead of Scan. Orders that haven't been sent to Shiprocket
        # yet simply have no shiprocketOrderId attribute and so no entry in
        # this index — same omission behavior as the expiry index above.
        - IndexName: shiprocketOrderId-index
          KeySchema:
            - AttributeName: shiprocketOrderId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: userId-createdAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Lets the hourly expiry sweep Query just the awaiting_payment
        # orders past their deadline instead of Scanning the whole table.
        # Orders without paymentExpiresAt (COD, or legacy Online orders)
        # simply have no entry in this index — DynamoDB omits an item from
        # a GSI whenever any of the index's key attributes are missing.
        - IndexName: paymentStatus-paymentExpiresAt-index
          KeySchema:
            - AttributeName: paymentStatus
              KeyType: HASH
            - AttributeName: paymentExpiresAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Capped-retry queue for Shiprocket shipment creation (Step 2) — mirrors
  # the paymentStatus-paymentExpiresAt-index pattern above: a GSI on
  # (status, nextAttemptAt) so the scheduled sweep Queries just the due jobs
  # instead of Scanning. jobId === the order's own orderId (1:1, natural
  # idempotency key).
  ShipmentJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_shipment_jobs_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: nextAttemptAt
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-nextAttemptAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: nextAttemptAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_carts_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: cartItemId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: cartItemId
          KeyType: RANGE

  WishlistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_wishlists_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: productId
          KeyType: RANGE

  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_contacts_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contactId
          AttributeType: S
      KeySchema:
        - AttributeName: contactId
          KeyType: HASH

  SettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_settings_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: settingsId
          AttributeType: S
      KeySchema:
        - AttributeName: settingsId
          KeyType: HASH

  AddressesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_addresses_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: addressId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: addressId
          KeyType: RANGE

  CouponsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_coupons_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_reviews_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reviewId
          AttributeType: S
        - AttributeName: productId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: reviewId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: productId-createdAt-index
          KeySchema:
            - AttributeName: productId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CouponRedemptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub satvex_coupon_redemptions_${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: redemptionId
          AttributeType: S
        - AttributeName: code
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: redemptionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: code-createdAt-index
          KeySchema:
            - AttributeName: code
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ## ---------- API + Lambda ----------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # $default (not the Stage name) so no stage segment appears in the URL —
      # otherwise API Gateway forwards it as part of the path (e.g. /dev/health)
      # and Express, which expects paths like /health, 404s on every request.
      StageName: $default
      # No CorsConfiguration here on purpose: AWS::Serverless::HttpApi's CORS
      # shorthand doesn't reliably resolve a dynamic (Fn::Split) AllowOrigins
      # list at transform time (confirmed: it silently kept only the first
      # origin). Express's own `cors` middleware in app.js already handles
      # CORS correctly for a comma-separated FRONTEND_ORIGIN, including
      # preflight OPTIONS (routed through via the proxy+ ANY method below), so
      # it's the single source of truth instead of two competing CORS layers.

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub satvex-api-${Stage}
      CodeUri: ./
      Handler: src/lambda.handler
      Environment:
        Variables:
          NODE_ENV: production
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          # AWS_REGION is provided automatically by the Lambda runtime (it's a
          # reserved env var name — CloudFormation would reject setting it here).
          TABLE_USERS: !Ref UsersTable
          TABLE_PRODUCTS: !Ref ProductsTable
          TABLE_ORDERS: !Ref OrdersTable
          TABLE_CARTS: !Ref CartsTable
          TABLE_WISHLISTS: !Ref WishlistsTable
          TABLE_CONTACTS: !Ref ContactsTable
          TABLE_SETTINGS: !Ref SettingsTable
          TABLE_ADDRESSES: !Ref AddressesTable
          TABLE_COUPONS: !Ref CouponsTable
          TABLE_REVIEWS: !Ref ReviewsTable
          TABLE_COUPON_REDEMPTIONS: !Ref CouponRedemptionsTable
          TABLE_OTP_CODES: !Ref OtpCodesTable
          TABLE_REFRESH_TOKENS: !Ref RefreshTokensTable
          SNS_SENDER_ID: !Ref SnsSenderId
          OTP_TEST_PHONES: !Ref OtpTestPhones
          MINIMOTH_API_KEY: !Ref MiniMothApiKey
          OTP_PROVIDER: !Ref OtpProvider
          S3_MEDIA_BUCKET: !Ref MediaBucket
          CLOUDFRONT_MEDIA_URL: !Sub https://${MediaDistribution.DomainName}
          JWT_SECRET: !Ref JwtSecret
          ACCESS_TOKEN_EXPIRES_IN: 1h
          REFRESH_TOKEN_MAX_AGE_DAYS: !Ref RefreshTokenMaxAgeDays
          RESET_TOKEN_EXPIRES_MIN: !Ref ResetTokenExpiresMin
          SES_SENDER_EMAIL: !Ref SesSenderEmail
          PAYU_MERCHANT_KEY: !Ref PayuMerchantKey
          PAYU_MERCHANT_SALT: !Ref PayuMerchantSalt
          PAYU_ENV: !Ref PayuEnv
          SHIPROCKET_EMAIL: !Ref ShiprocketEmail
          SHIPROCKET_PASSWORD: !Ref ShiprocketPassword
          SHIPROCKET_WEBHOOK_TOKEN: !Ref ShiprocketWebhookToken
          SHIPROCKET_BASE_URL: !Ref ShiprocketBaseUrl
          SHIPROCKET_SERVICEABILITY_BASE_URL: !Ref ShiprocketServiceabilityBaseUrl
          TABLE_SHIPMENT_JOBS: !Ref ShipmentJobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WishlistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AddressesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponRedemptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ShipmentJobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OtpCodesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RefreshTokensTable
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        # Not SESCrudPolicy (which scopes to a single identity): recipients
        # here are admin-configurable settings (contactEmail), not just the
        # fixed sender identity, and SES authorizes ses:SendEmail against
        # every identity ARN a send touches — so this must cover any
        # identity in the account, not only SesSenderEmail's.
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
        # SNS SMS publish is account-wide (no per-topic resource — SNS
        # direct-to-phone-number publish has no ARN to scope a resource
        # policy to), per AWS's own documented pattern for this API.
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: '*'
      Events:
        ProxyAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/satvex-api-${Stage}
      RetentionInDays: 14

  # Hourly sweep that expires stale awaiting_payment orders and releases
  # their coupons — see src/expirePayments.js and 18-payment-gateway.md §8.
  # Separate function (not routed through the Express app/API Gateway)
  # since EventBridge invokes it directly.
  ExpirePaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub satvex-expire-payments-${Stage}
      CodeUri: ./
      Handler: src/expirePayments.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_ORDERS: !Ref OrdersTable
          TABLE_COUPONS: !Ref CouponsTable
          TABLE_COUPON_REDEMPTIONS: !Ref CouponRedemptionsTable
          PAYU_MERCHANT_KEY: !Ref PayuMerchantKey
          PAYU_MERCHANT_SALT: !Ref PayuMerchantSalt
          PAYU_ENV: !Ref PayuEnv
          # Needed transitively: a reconciled-paid order now calls
          # shipmentService.triggerShipmentIfNeeded, which reads settings
          # and (if Shiprocket is enabled) writes a shipment retry job.
          TABLE_SETTINGS: !Ref SettingsTable
          TABLE_SHIPMENT_JOBS: !Ref ShipmentJobsTable
          SHIPROCKET_EMAIL: !Ref ShiprocketEmail
          SHIPROCKET_PASSWORD: !Ref ShiprocketPassword
          SHIPROCKET_BASE_URL: !Ref ShiprocketBaseUrl
          SHIPROCKET_SERVICEABILITY_BASE_URL: !Ref ShiprocketServiceabilityBaseUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponRedemptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ShipmentJobsTable
      Events:
        HourlySweep:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)

  ExpirePaymentsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/satvex-expire-payments-${Stage}
      RetentionInDays: 14

  # Retries queued Shiprocket shipment-creation jobs every 10 minutes — the
  # immediate attempt in triggerShipmentIfNeeded tries first; this is the
  # fallback for whatever didn't succeed right away, with capped attempts
  # and a failed-jobs list (see shipmentJobService.js / shipmentSweep.js).
  ShipmentSweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub satvex-shipment-sweep-${Stage}
      CodeUri: ./
      Handler: src/shipmentSweep.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_ORDERS: !Ref OrdersTable
          TABLE_SHIPMENT_JOBS: !Ref ShipmentJobsTable
          TABLE_SETTINGS: !Ref SettingsTable
          SHIPROCKET_EMAIL: !Ref ShiprocketEmail
          SHIPROCKET_PASSWORD: !Ref ShiprocketPassword
          SHIPROCKET_BASE_URL: !Ref ShiprocketBaseUrl
          SHIPROCKET_SERVICEABILITY_BASE_URL: !Ref ShiprocketServiceabilityBaseUrl
          SES_SENDER_EMAIL: !Ref SesSenderEmail
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ShipmentJobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
        # Same as ApiFunction's SES policy — shipmentAlertEmail is an
        # admin-configurable recipient, not the fixed sender identity.
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Events:
        TenMinuteSweep:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)

  ShipmentSweepFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/satvex-shipment-sweep-${Stage}
      RetentionInDays: 14

  ## ---------- S3: product/variant media ----------

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub satvex-media-${Stage}-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [',', !Ref FrontendOrigin]
            AllowedMethods: [GET, PUT]
            AllowedHeaders: ['*']
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MediaOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub satvex-media-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: media-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        Origins:
          - Id: media-s3-origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref MediaOAC
            S3OriginConfig:
              OriginAccessIdentity: ''

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}

  ## ---------- S3 + CloudFront: static frontend ----------

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub satvex-frontend-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub satvex-frontend-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        WebACLId: !If [HasFrontendWebAcl, !Ref FrontendWebAclArn, !Ref 'AWS::NoValue']
        Aliases: !If [HasFrontendDomain, !Ref FrontendDomainNames, !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasFrontendDomain
          - AcmCertificateArn: !Ref FrontendCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref 'AWS::NoValue'
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRouterFunction.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt FrontendRouterFunction.FunctionARN
        Origins:
          - Id: frontend-s3-origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        # SPA routing is done by FrontendRouterFunction (known app routes ->
        # /index.html). Anything it does not recognise - and any missing file,
        # which S3 reports as 403 behind OAC - is a genuine HTTP 404 with the
        # branded page, never a 200 "soft 404".
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10

  # Storefront edge function (one function, two events).
  #  viewer-request : rewrites the SPA's real routes to /index.html and sends
  #                   every other extension-less path to a key that cannot
  #                   exist, so CloudFront answers a true 404 + /404.html.
  #                   Keep the route list in step with frontend/src/App.jsx.
  #  viewer-response: adds the security headers. They live here rather than in
  #                   a ResponseHeadersPolicy because the distribution is on the
  #                   CloudFront Free pricing plan, which does not allow custom
  #                   response headers policies.
  FrontendRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub satvex-frontend-router-${Stage}
      AutoPublish: true
      FunctionConfig:
        Comment: SPA route allowlist (real 404s) and security headers
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var ROUTES = [
          /^\/$/,
          /^\/(shop|about|contact|shipping-policy|returns-refunds|privacy-policy|terms-conditions|login|wishlist|cart|checkout|profile|orders)$/,
          /^\/product\/[^\/]+$/,
          /^\/order-confirmation\/[^\/]+$/,
          /^\/orders\/[^\/]+$/,
          /^\/account(\/(orders|addresses|profile))?$/,
          /^\/account\/orders\/[^\/]+$/,
          /^\/admin(\/(products|products\/new|orders|analytics|shipment-issues|customers|contacts|coupons|reviews|banners|announcements|settings))?$/,
          /^\/admin\/(products|orders|contacts)\/[^\/]+$/
        ];

        // script-src is 'self' only (Vite emits no inline scripts). Styles need
        // 'unsafe-inline' for React style attributes. Images/media allow https:
        // because product media comes from the media CDN. form-action is
        // intentionally NOT set: the PayU checkout POSTs to PayU and is then
        // redirected through bank pages, which Chrome also checks against it.
        var CSP = [
          "default-src 'self'",
          "script-src 'self'",
          "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com",
          "font-src 'self' data: https://fonts.gstatic.com",
          "img-src 'self' data: blob: https:",
          "media-src 'self' blob: https:",
          "connect-src 'self' https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com https://api.postalpincode.in https://*.s3.${AWS::Region}.amazonaws.com https://*.s3.amazonaws.com",
          "object-src 'none'",
          "base-uri 'self'",
          "frame-ancestors 'none'"
        ].join('; ');

        var SECURITY_HEADERS = {
          'strict-transport-security': 'max-age=31536000; includeSubDomains',
          'x-content-type-options': 'nosniff',
          'x-frame-options': 'DENY',
          'referrer-policy': 'strict-origin-when-cross-origin',
          'permissions-policy': 'camera=(), microphone=(), geolocation=(), payment=(self)',
          'content-security-policy': CSP
        };

        function handler(event) {
          if (event.response) {
            var response = event.response;
            for (var name in SECURITY_HEADERS) {
              response.headers[name] = { value: SECURITY_HEADERS[name] };
            }
            return response;
          }

          var request = event.request;
          var uri = request.uri;

          // Files (assets, sitemap.xml, robots.txt, 404.html...) go to S3 as is.
          if (/\.[A-Za-z0-9]{1,10}$/.test(uri)) return request;

          var path = uri.length > 1 ? uri.replace(/\/+$/, '') : uri;
          for (var i = 0; i < ROUTES.length; i++) {
            if (ROUTES[i].test(path)) {
              request.uri = '/index.html';
              return request;
            }
          }

          // Not a route: a key that cannot exist -> S3 403 -> custom 404 page.
          request.uri = '/__not_found__';
          return request;
        }

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Description: Base URL for the API (set as VITE_API_URL/api in the frontend)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com

  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionDomain:
    Description: Point your custom domain (or use directly) at this CloudFront domain
    Value: !GetAtt FrontendDistribution.DomainName

  MediaBucketName:
    Value: !Ref MediaBucket
  MediaDistributionDomain:
    Value: !GetAtt MediaDistribution.DomainName

  UsersTableName:
    Value: !Ref UsersTable
  ProductsTableName:
    Value: !Ref ProductsTable
  OrdersTableName:
    Value: !Ref OrdersTable
  CartsTableName:
    Value: !Ref CartsTable
  WishlistsTableName:
    Value: !Ref WishlistsTable
  ContactsTableName:
    Value: !Ref ContactsTable
  SettingsTableName:
    Value: !Ref SettingsTable
  AddressesTableName:
    Value: !Ref AddressesTable
  CouponsTableName:
    Value: !Ref CouponsTable
  ReviewsTableName:
    Value: !Ref ReviewsTable
  CouponRedemptionsTableName:
    Value: !Ref CouponRedemptionsTable
  ShipmentJobsTableName:
    Value: !Ref ShipmentJobsTable
